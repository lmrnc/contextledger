name: contextledger
x-n8n: &n8n
  image: docker.n8n.io/n8nio/n8n:2.46.6
  environment:
    - N8N_ENCRYPTION_KEY
    - CONTEXTLEDGER_INTERNAL_KEY
    - CONTEXTLEDGER_INTERNAL_URL=http://adapter:5679
    - N8N_HOST=127.0.0.1
    - N8N_LISTEN_ADDRESS=0.0.0.0
    - N8N_PORT=5678
    - N8N_PROTOCOL=http
    - N8N_WEBHOOK_URL=http://127.0.0.1:5678/
    - N8N_SECURE_COOKIE=false
    - GENERIC_TIMEZONE=UTC
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    - N8N_COMMUNITY_PACKAGES_ENABLED=false
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    - N8N_RUNNERS_MODE=internal
    - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    - EXECUTIONS_DATA_SAVE_ON_ERROR=none
    - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
    - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
  volumes:
    - editor:/home/node/.n8n
    - ./workflows:/workflows:ro
services:
  n8n:
    <<: *n8n
    ports:
      - "127.0.0.1:5678:5678"
  import:
    <<: *n8n
    profiles: [setup]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >
        n8n import:workflow --separate --input=/workflows;
        for id in CLIngest00000001 CLDetect00000001 CLReview00000001 CLContext0000001 CLMonitor0000001; do
          n8n publish:workflow --id="$$id";
        done
  adapter:
    build: .
    environment:
      CONTEXTLEDGER_BIND: 0.0.0.0
      CONTEXTLEDGER_RUNTIME: /data
      CONTEXTLEDGER_DEPS_DIR: /opt/contextledger
      CONTEXTLEDGER_INTERNAL_PORT: 5679
      CONTEXTLEDGER_UI_PORT: 5680
      CONTEXTLEDGER_N8N_URL: http://n8n:5678
    volumes:
      - ./.runtime/compose:/data
    ports:
      - "127.0.0.1:5680:5680"
volumes:
  editor:
